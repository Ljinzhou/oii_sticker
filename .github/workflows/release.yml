# 发版流水线：推 v* tag 即自动构建 + 签名 + 发布 + 生成更新清单（含镜像变体）。
#
# 前置一次性配置（GitHub 仓库 Settings → Secrets and variables → Actions）：
#   TAURI_SIGNING_PRIVATE_KEY           私钥内容或路径（~/.tauri/oii_sticker.key）
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  私钥密码（本项目为空，可留空字符串）
#
# 此后日常发版：改 package.json 的 version（或 node scripts/bump-version.mjs X.Y.Z）
#   → git tag vX.Y.Z && git push origin vX.Y.Z —— 其余全自动。
# 版本单一来源 = package.json；Cargo.toml / Cargo.lock 由 scripts/bump-version.mjs 同步，
# tauri.conf.json 通过 "version": "../package.json" 自动跟随。
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 完整历史：守门步骤需要判定 tag 是否属于 master 祖先链

      - name: Guard · 仅允许 master 历史上的 tag 发布
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master --no-tags
          if ! git merge-base --is-ancestor "${GITHUB_REF_NAME}" FETCH_HEAD; then
            echo "::error::Tag ${GITHUB_REF_NAME} 不在 master 分支历史中。请先把代码合并到 master，再在 master 上打 tag 发布。"
            exit 1
          fi
          echo "✅ ${GITHUB_REF_NAME} 位于 master 历史，允许发布"

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Diagnose · 校验更新签名 secret
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEY="${TAURI_SIGNING_PRIVATE_KEY:-}"
          PWD_VAL="${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}"
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY 为空！请在仓库 Settings → Secrets → Actions 创建该 secret 并填入私钥 base64 内容。"
            exit 1
          fi
          echo "私钥 base64 长度: ${#KEY}"
          echo "私钥 SHA-256: $(printf '%s' "$KEY" | sha256sum | cut -d' ' -f1)"
          DECODED="$(printf '%s' "$KEY" | base64 --decode 2>/dev/null || true)"
          if printf '%s' "$DECODED" | grep -q 'untrusted comment: rsign encrypted secret key'; then
            echo "✅ 私钥 base64 解码正常，格式为 rsign encrypted secret key"
          else
            echo "::warning::私钥 base64 解码后格式异常，应为 rsign encrypted secret key"
          fi
          if [ -z "$PWD_VAL" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY_PASSWORD 为空！"
          else
            echo "✅ TAURI_SIGNING_PRIVATE_KEY_PASSWORD 已设置（长度 ${#PWD_VAL}）"
          fi

      - name: Guard · 校验版本一致性（防产物版本错乱）
        shell: bash
        run: |
          set -euo pipefail
          node scripts/bump-version.mjs check
          echo "校验：package.json / Cargo.toml / tauri.conf.json(派生) 版本一致"

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "oii_sticker v__VERSION__"
          releaseBody: "在 Assets 中下载安装包。应用内「设置 → 关于 → 检查更新」可自动升级到本版本。"
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Cleanup · 删除废弃的镜像变体清单（latest-m*.json）
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_url="repos/{owner}/{repo}/releases/tags/${GITHUB_REF_NAME}"
          for name in $(gh api "$release_url" --jq '.assets[].name' | grep '^latest-m' || true); do
            asset_id="$(gh api "$release_url" --jq --arg n "$name" '.assets[] | select(.name == $n) | .id')"
            echo "删除废弃资产: ${name} (id=${asset_id})"
            gh api -X DELETE "repos/{owner}/{repo}/releases/assets/${asset_id}"
          done
          echo "清理完成"
